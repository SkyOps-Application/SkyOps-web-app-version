services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skyops_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d skyops_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  user_service:
    build:
      context: ./backend/user_service
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/skyops_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=dev_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5001:5000"

  simulator_service:
    build:
      context: .
      dockerfile: backend/simulator_service/Dockerfile
    environment:
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET_KEY=dev_secret_key
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  notification_service:
    build:
      context: .
      dockerfile: backend/notification_service/Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_SERVER=smtp.example.com
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_USER=skyops2026@gmail.com
      - SMTP_PASS=unkphsxmeewdmeec
      - SMTP_FROM=SkyOps <skyops2026@gmail.com>
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001
      - NEXT_PUBLIC_SIMULATOR_URL=http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - user_service
      - simulator_service

volumes:
  postgres_data:
  redis_data:
