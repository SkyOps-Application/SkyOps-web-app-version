services:
  - type: web
    name: atc-radar-backend
    env: node
    buildCommand: cd ../shared && npm install && npm run build && cd ../backend && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false

