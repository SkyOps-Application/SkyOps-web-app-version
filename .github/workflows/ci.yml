name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Lint and Type Check for TypeScript projects
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atc-radar-sim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Run ESLint (Frontend)
        run: npm run lint --workspace=frontend
        continue-on-error: true

      - name: Type Check (Frontend)
        run: npm run type-check --workspace=frontend

      - name: Type Check (Shared)
        run: npm run type-check --workspace=shared

  # Test Shared Package
  test-shared:
    name: Test Shared Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atc-radar-sim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --workspace=shared

  # Test Frontend
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atc-radar-sim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Run tests
        run: npm test --workspace=frontend

  # Test Python User Service
  test-python:
    name: Test Python User Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atc-radar-sim/backend/user_service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///:memory:

  # Build verification
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-shared, test-frontend, test-python]
    defaults:
      run:
        working-directory: atc-radar-sim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Build frontend
        run: npm run build --workspace=frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001
          NEXT_PUBLIC_SIMULATOR_URL: http://localhost:4000

      - name: Build backend
        run: npm run build --workspace=backend
