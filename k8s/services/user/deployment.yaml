apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      dnsConfig:
        options:
          - name: timeout
            value: "5"
          - name: attempts
            value: "5"
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-host
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-port
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 $(POSTGRES_HOST) $(POSTGRES_PORT); do
                echo "waiting for postgres to be ready..."
                sleep 2
              done
        - name: wait-for-redis
          image: busybox:1.36
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: redis-port
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 $(REDIS_HOST) $(REDIS_PORT); do
                echo "waiting for redis to be ready..."
                sleep 2
              done
      containers:
        - name: user
          image: atc-radar-sim-user_service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres_pwd
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-host
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres_db
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: redis-port
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: user-secret
                  key: SECRET_KEY

---

apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  type: NodePort
  selector:
    app: user
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 5001
      nodePort: 30003
