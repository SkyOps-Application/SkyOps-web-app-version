apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: atc-radar-sim-notification_service:latest
          ports:
            - containerPort: 4000
          env:
            - name: REDIS_HOST
              value: redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: MAIL_SERVER
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: MAIL_SERVER
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: SMTP_PASS
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: SMTP_FROM

---

apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  type: NodePort
  selector:
    app: notification
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 4000
      nodePort: 30004
